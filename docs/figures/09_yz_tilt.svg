<ellipse cx="180" cy="-150" rx="270" ry="134.164079" transform="rotate(-39.805571 180 -150)" fill="none" stroke="#316b96" stroke-width="2.2"/>
<ellipse cx="180" cy="150" rx="270" ry="134.164079" transform="rotate(39.805571 180 150)" fill="none" stroke="#a57236" stroke-width="2.2"/>
