<ellipse cx="360" cy="460" rx="216" ry="93" fill="none" stroke="#d5dfe5" stroke-width="1"/>
<path d="M360 360V560" fill="none" stroke="#afbdc6" stroke-width="1.2" stroke-dasharray="4 7"/>
<path d="M80 460H990" fill="none" stroke="#7e94a3" stroke-width="1.4" stroke-dasharray="6 8"/>
<ellipse cx="610" cy="320" rx="340" ry="183.030052" transform="rotate(-29.248826 610 320)" fill="none" stroke="#316b96" stroke-width="3"/>
<ellipse cx="610" cy="600" rx="340" ry="183.030052" transform="rotate(29.248826 610 600)" fill="none" stroke="#a57236" stroke-width="3"/>
<g aria-label="Candidate answers in the upper set">
<circle cx="570" cy="285" r="6" fill="#316b96" stroke="#fdfdfb" stroke-width="2"/>
<circle cx="685" cy="320" r="6" fill="#316b96" stroke="#fdfdfb" stroke-width="2"/>
