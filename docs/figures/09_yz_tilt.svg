<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
<title id="title">Swept orbital conditions from prompt toward paradox</title>
<desc id="desc">The circle is rotated a quarter turn and kept in perspective. Direct answer sits on the left, prompt at the center, and paradox on the right. Two elongated orbital ellipses share their visible near focus at prompt and sweep toward paradox above and below the plane. Each far focus lies beyond the right edge. Blue shading marks potential escape conditions; amber shading marks conditions strengthening the paradox. Dashed axes show the inclinations toward the unseen foci.</desc>
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263b47;letter-spacing:1.2px}.condition{font-size:26px;font-weight:600}.label{font-size:19px;font-weight:600}</style>
<clipPath id="above"><rect width="1120" height="460"/></clipPath>
<clipPath id="below"><rect y="460" width="1120" height="460"/></clipPath>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cad6df"/><stop offset="1" stop-color="#edf1f3"/></linearGradient>
<linearGradient id="edge-fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="white"/><stop offset=".84" stop-color="white"/><stop offset="1" stop-color="#888"/></linearGradient>
<mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1120" height="920"><rect width="1120" height="920" fill="url(#edge-fade)"/></mask>
</defs>
<rect width="1120" height="920" fill="#fdfdfb"/>
