<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">Condition ellipses in the circle's shared perspective</title>
<desc id="desc">A larger prompt-response circle and two smaller closed condition ellipses share one x-axis viewing tilt. Direct answer is left, prompt is the center, and paradox is right. The upper region is labeled escape conditions and the lower strengthening conditions. Candidate points remain enclosed. The ellipses share the prompt focus in the common plane before perspective projection.</desc>
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263b47;letter-spacing:1px}.condition{font-size:20px;font-weight:600;paint-order:stroke fill;stroke:#fdfdfb;stroke-width:3px;stroke-linejoin:round}.label{font-size:19px;font-weight:600}path,circle,ellipse,line{vector-effect:non-scaling-stroke}</style>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9d6df"/><stop offset="1" stop-color="#eef2f4"/></linearGradient>
</defs>
<rect width="1120" height="520" fill="#fdfdfb"/>
