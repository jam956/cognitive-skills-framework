<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
<title id="title">Two orbital sets of possible answers</title>
<desc id="desc">Direct answer is left of the projected circle, prompt is its center, and paradox is on the right. Two complete tilted ellipses share their near focus at prompt and enclose candidate answers above and below the paradox zone. Blue and amber points stand for possible answers under upper escape and lower strengthening conditions. Both closed boundaries fit inside the picture.</desc>
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263b47;letter-spacing:1.2px}.set-label{font-size:25px;font-weight:600}.label{font-size:19px;font-weight:600}</style>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cad6df"/><stop offset="1" stop-color="#edf1f3"/></linearGradient>
</defs>
<rect width="1120" height="920" fill="#fdfdfb"/>
<ellipse cx="610" cy="320" rx="340" ry="183.030052" transform="rotate(-29.248826 610 320)" fill="#dcebf6" opacity=".65"/>
