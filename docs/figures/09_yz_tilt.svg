<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
  <title id="title">The tilt: evaluate conditions beyond the opening plane</title>
  <desc id="desc">The same conceptual dial is seen obliquely as a thin circular plane. From the paradox position a blue path rises above the plane, changes its relation, and returns to the shared question. An amber path passes below the plane and repeats a loop: the limiting condition remains. Escape and entrapment are outcomes to test, not consequences of physical elevation. The chapter supplies the conditions and concrete case.</desc>
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#263b47;letter-spacing:1.5px}.label{font-size:25px;font-weight:600}.outcome{font-size:29px;font-weight:600}</style>
    <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f0f5"/><stop offset="0.55" stop-color="#fdfdfb"/><stop offset="1" stop-color="#f6ead9"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9d5dd"/><stop offset="1" stop-color="#ebeff1"/></linearGradient>
    <marker id="blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#316b96"/></marker>
    <marker id="amber" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#a57236"/></marker>
  </defs>
