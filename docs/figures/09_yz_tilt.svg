  <path d="M250 440A310 122 0 0 1 870 440" fill="none" stroke="#93a5b0" stroke-width="1.6" stroke-dasharray="5 7"/>
  <ellipse cx="560" cy="440" rx="292" ry="113" fill="none" stroke="#d7e0e5" stroke-width="1"/>
