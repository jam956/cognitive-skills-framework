<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
<title id="title">Conditions above and below the opening plane</title>
<desc id="desc">The same quadrant dial is seen obliquely as a circular plane on a horizontal horizon. An inclined blue orbit shades the region above the horizon for conditions that may release a paradox. A complementary amber orbit shades the region below for conditions that strengthen the paradox. Both evaluations can be informative. Their placement illustrates different condition sets rather than inherent merit or measured model geometry.</desc>
