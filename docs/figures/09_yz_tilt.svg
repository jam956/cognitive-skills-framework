<g clip-path="url(#below)"><ellipse cx="905" cy="640" rx="620" ry="234.467482" transform="rotate(18.277110 905 640)" fill="none" stroke="#a57236" stroke-width="3.5"/></g>
<g clip-path="url(#below)"><ellipse cx="905" cy="280" rx="620" ry="234.467482" transform="rotate(-18.277110 905 280)" fill="none" stroke="#8db3d0" stroke-width="1.7" stroke-dasharray="5 7" opacity=".65"/></g>
<g clip-path="url(#above)"><ellipse cx="905" cy="640" rx="620" ry="234.467482" transform="rotate(18.277110 905 640)" fill="none" stroke="#c6a175" stroke-width="1.7" stroke-dasharray="5 7" opacity=".65"/></g>
