<circle cx="725" cy="395" r="6" fill="#316b96" stroke="#fdfdfb" stroke-width="2"/>
</g>
<g aria-label="Candidate answers in the lower set">
<circle cx="570" cy="635" r="6" fill="#a57236" stroke="#fdfdfb" stroke-width="2"/>
<circle cx="685" cy="600" r="6" fill="#a57236" stroke="#fdfdfb" stroke-width="2"/>
