<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
<title id="title">Four directions around a prompt and response</title>
<desc id="desc">A question sits at the center of a numberless dial. The vertical axis points to direct answer at twelve o'clock and paradox at six. Thesis occupies the upper-left quadrant, antithesis the lower-left, alternatives the lower-right, and synthesis the upper-right. These are overlapping directions of inquiry, not mandatory stages or an exhaustive classification.</desc>
