<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
  <title id="title">The circle: a dial of possible directions</title>
  <desc id="desc">A numberless clock face holds a shared question at its pivot. Thesis and antithesis face one another vertically; paradox and synthesis lie on the lateral axis. Opposed hands and two partial curved arrows suggest changes of position without prescribing a full sequence. The direction labels are conceptual bearings.</desc>
