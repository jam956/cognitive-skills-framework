<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
<title id="title">Four directions around a prompt and response</title>
<desc id="desc">A prompt sits at the center of a numberless quadrant dial. A bold vertical arrow extends beyond the circle at both ends and points upward to direct answer; paradox curves around its tail. Thesis is upper left, antithesis lower left, alternatives lower right, and synthesis upper right. The curved labels follow the arrow tip and tail.</desc>
